# cargo-deny configuration. GPL, AGPL and unknown licences are denied:
# anything not on the allow list fails `cargo deny check licenses`.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "MPL-2.0",
  "ISC",
  # Permissive licences outside the plan's base list; see docs/DECISIONS.md.
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "OFL-1.1",
]
# WTFPL is permitted only for the FFmpeg bindings, which PLAN.md names.
exceptions = [
  { allow = ["WTFPL"], crate = "ffmpeg-next" },
  { allow = ["WTFPL"], crate = "ffmpeg-sys-next" },
]
# Workspace crates are dual MIT/Apache-2.0 and unpublished.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
