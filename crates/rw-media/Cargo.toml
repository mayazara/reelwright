[package]
name = "rw-media"
description = "Media I/O behind the MediaIo trait: probe, decode, encode, mux, proxies, thumbnails, waveforms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rw-model.workspace = true
ffmpeg-next.workspace = true
image.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# FFmpeg side data (display matrix, pixel format flags) is only reachable
# through raw FFI. Each unsafe block documents its invariants.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"

[features]
# Test-only: generates media fixtures with the `ffmpeg` command-line tool.
fixtures = []
