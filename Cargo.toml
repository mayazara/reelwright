[workspace]
resolver = "3"
members = ["app", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
rw-model = { path = "crates/rw-model" }
rw-edit = { path = "crates/rw-edit" }
rw-media = { path = "crates/rw-media" }
rw-cache = { path = "crates/rw-cache" }
rw-render = { path = "crates/rw-render" }
rw-fx = { path = "crates/rw-fx" }
rw-text = { path = "crates/rw-text" }
rw-audio = { path = "crates/rw-audio" }
rw-engine = { path = "crates/rw-engine" }
rw-capture = { path = "crates/rw-capture" }
rw-ai = { path = "crates/rw-ai" }
rw-assets = { path = "crates/rw-assets" }
rw-ui = { path = "crates/rw-ui" }

# Third party — exact pins; every entry is recorded in docs/DEPENDENCIES.md
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"] }
egui = { version = "=0.36.2", default-features = false }
egui_dock = "=0.21.1"
egui_kittest = { version = "=0.36.2", features = ["eframe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
directories = "=6.0.0"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
blake3 = "=1.8.7"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rfd = "=0.17.2"
crossbeam-channel = "=0.5.17"
proptest = "=1.12.0"
tempfile = "=3.27.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
pollster = "=1.0.1"
ringbuf = "=0.4.8"
cpal = "=0.18.2"
winresource = "=0.1.31"
bytemuck = { version = "=1.25.2", features = ["derive"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
unicode-script = "=0.5.8"
gif = "=0.14.2"
resvg = { version = "=0.48.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Small debug builds: line numbers for our crates (enough for backtraces),
# no debug info for dependencies. Full debug info made `target/` exceed
# 100 GB across the test binaries.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
