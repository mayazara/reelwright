name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info: test binaries (with embedded fonts) otherwise fill the
  # runners' disks.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: scripts/brand-lint.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The media matrix has 21 fixtures; one needs FFmpeg 7+ to write a
          # display matrix, so older runner FFmpeg builds may make 20.
          - os: ubuntu-latest
            min_fixtures: 20
            # Software Vulkan (lavapipe) is installed.
            require_gpu: '1'
          - os: macos-latest
            min_fixtures: 20
            require_gpu: '1'
          # The LGPL Windows build has no x265, so HEVC fixtures may skip.
          - os: windows-latest
            min_fixtures: 17
            # WARP (Windows' software renderer) is always present.
            require_gpu: '1'
    runs-on: ${{ matrix.os }}
    env:
      RW_MIN_FIXTURES: ${{ matrix.min_fixtures }}
      RW_REQUIRE_GPU: ${{ matrix.require_gpu }}
      # CJK and emoji text come from system fonts; every runner has them.
      RW_REQUIRE_SCRIPT_FONTS: '1'
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  offline:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      RW_MIN_FIXTURES: 20
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
      - run: |
          # Ubuntu 24.04+ restricts unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fetch && cargo test --workspace --no-run
      - run: scripts/test-offline.sh
